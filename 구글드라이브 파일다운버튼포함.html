<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 확인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  section {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 1.2rem;
    margin-bottom: 16px;
    font-weight: 500;
    color: #ccc;
    text-align: center;
  }
  .desc {
    font-size: 0.95rem;
    line-height: 1.7;
    color: #ffd400;
    text-align: center;
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .download-row {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 6px;
    background: #fffff0;
    color: #111;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  .download-btn:hover { background: #ebebd0; }
  .yt-embed {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    background: #000;
    overflow: hidden;
  }
  .yt-embed iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>
  <section>
    <h1>★이뮤니프 본이너스★</h1>
    <!-- 설명 텍스트: 내용을 자유롭게 수정하세요 -->
    <p class="desc">
      이뮤니프 AI휴먼이 소개하는 본이너스 칼슘 제품 영상입니다.
      영상을 확인하신 후 의견을 남겨주세요.
    </p>
    <div class="yt-embed">
      <iframe src="https://www.youtube.com/embed/-Kv2nbNHQb0" title="이뮤니프 본이너스" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

    <!-- 다운로드 버튼: 구글 드라이브 파일 직접 다운로드 -->
    <div class="download-row">
      <a class="download-btn"
         href="https://drive.usercontent.google.com/download?id=1IPb59J5kQPDJPMesXGmWWXdv7LmS7zAQ&export=download&confirm=t">
        ⬇ 영상 다운로드 (mp4)
      </a>
    </div>
  </section>
</body>
</html>
